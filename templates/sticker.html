<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sticker template</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --blue:#2F6FE4; --ink:#1B1B1F; --rasp:#C2335A; }
  body { margin:0; background:#ddd; display:flex; flex-direction:column; align-items:center; gap:40px; padding:40px 0; }
  .slide { width:1080px; height:1350px; position:relative; overflow:hidden; font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
    background-color:#FBFAF7;
    background-image:linear-gradient(#ECEAE4 1.5px,transparent 1.5px),linear-gradient(90deg,#ECEAE4 1.5px,transparent 1.5px);
    background-size:54px 54px; }
  .outlined { color:#F9C9DA; -webkit-text-stroke:14px #B8264F; paint-order:stroke fill; font-weight:700; }
  .card { background:#fff; border:4px solid var(--ink); border-radius:30px; box-shadow:10px 10px 0 var(--ink); padding:40px 44px; }
  .badge { width:96px; height:96px; flex:none; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:60px; font-weight:700; }
  .sticker { position:absolute; filter:drop-shadow(0 6px 0 rgba(0,0,0,.12)); }
  .top { position:absolute; left:64px; right:64px; top:52px; display:flex; justify-content:space-between; align-items:center; font-size:32px; font-weight:600; }
  .top b { background:var(--ink); color:#fff; border-radius:999px; padding:8px 24px; font-weight:600; }
  .bar { position:absolute; left:40px; right:40px; bottom:44px; height:86px; display:flex; align-items:center; justify-content:space-between; }
  .bar::before { content:""; position:absolute; left:0; right:0; top:41px; height:5px; background:var(--blue); }
  .bar span { position:relative; background:#fff; border-radius:999px; padding:16px 30px; font-size:36px; font-weight:600; box-shadow:0 4px 0 rgba(0,0,0,.08); }
  .bar span.save { background:#FFD45C; font-weight:700; }
</style>
</head>
<body>

<!-- COVER -->
<section class="slide">
  <svg class="sticker" aria-hidden="true" width="140" height="140" viewBox="0 0 140 140" style="right:60px; top:280px">
    <g stroke="#fff" stroke-width="30" stroke-linecap="round"><path d="M70 14V126M14 70H126M30 30L110 110M110 30L30 110"/></g>
    <g stroke="#F06A2B" stroke-width="18" stroke-linecap="round"><path d="M70 14V126M14 70H126M30 30L110 110M110 30L30 110"/></g>
  </svg>
  <svg class="sticker" aria-hidden="true" width="150" height="130" viewBox="0 0 150 130" style="left:56px; top:290px; transform:rotate(-10deg)">
    <rect x="6" y="6" width="138" height="118" rx="18" fill="#1B1B1F" stroke="#fff" stroke-width="8"/>
    <path d="M32 66L52 82L32 98" fill="none" stroke="#7CF2A6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 98H104" stroke="#7CF2A6" stroke-width="8" stroke-linecap="round"/>
  </svg>
  <div style="position:absolute; left:0; top:80px; width:100%; display:flex; flex-direction:column; align-items:center; gap:18px">
    <div style="font-size:78px; font-weight:700; letter-spacing:-2px"><span style="color:var(--blue)">the prompts</span> that turned</div>
    <div style="background:var(--blue); border-radius:30px; padding:14px; box-shadow:0 10px 0 rgba(27,27,31,.12)">
      <div style="border:5px dashed rgba(255,255,255,.8); border-radius:20px; padding:0 44px; font-size:200px; font-weight:700; color:#fff; line-height:1.12">Claude</div>
    </div>
    <div class="outlined" style="font-size:104px; letter-spacing:-2px">into my reviewer</div>
    <div style="border:4px dashed var(--rasp); border-radius:999px; padding:12px 40px; background:#fff; font-size:42px; font-weight:600">6 steps, copy-paste ready</div>
  </div>
  <div class="bar"><span>@decodedebangi</span><span class="save">save for later</span><span>swipe →</span></div>
</section>

<!-- CONTENT -->
<section class="slide">
  <div class="top"><span>@decodedebangi</span><b>2/8</b></div>
  <div style="position:absolute; left:64px; right:64px; top:150px; display:flex; flex-direction:column; gap:44px">
    <div style="font-size:72px; font-weight:700; line-height:1.05; letter-spacing:-1.5px">slide headline <span style="color:var(--blue)">↓</span></div>
    <div class="card" style="display:flex; flex-direction:column; gap:22px">
      <div style="display:flex; align-items:center; gap:24px"><div class="badge">1</div><div style="font-size:54px; font-weight:700">Step title</div></div>
      <div style="font-size:40px; font-weight:500">→ what happens, with a <b>bold bit</b></div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:32px">
      <div class="card" style="background:#F9C9DA"><div style="font-size:120px; font-weight:700; line-height:1">2x+</div><div style="font-size:38px; font-weight:600">label</div></div>
      <div class="card" style="background:#C7F0D8"><div style="font-size:120px; font-weight:700; line-height:1">−40%</div><div style="font-size:38px; font-weight:600">label</div></div>
    </div>
  </div>
  <div style="position:absolute; right:64px; bottom:52px; font-size:36px; font-weight:600">swipe →</div>
</section>

</body>
</html>
