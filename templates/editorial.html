<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editorial template</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --accent:#D2552F; --ink:#141414; --muted:#6B625A; }
  body { margin:0; background:#ddd; display:flex; flex-direction:column; align-items:center; gap:40px; padding:40px 0; }
  .slide { width:1080px; height:1350px; position:relative; overflow:hidden; font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
    background-color:#FBF6EF;
    background-image:linear-gradient(#E6DACB 2px,transparent 2px),linear-gradient(90deg,#E6DACB 2px,transparent 2px);
    background-size:54px 54px; }
  .handle { position:absolute; left:0; top:52px; width:100%; text-align:center; font-size:38px; font-weight:700; color:var(--accent); }
  .count { position:absolute; right:52px; top:38px; width:100px; height:100px; border-radius:50%; background:rgba(110,104,98,.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:700; }
  .body { position:absolute; left:80px; right:80px; top:170px; display:flex; flex-direction:column; gap:32px; }
  .pill { font-family:'JetBrains Mono',monospace; font-size:32px; color:#fff; background:var(--ink); border-radius:999px; padding:12px 30px; align-self:flex-start; }
  .anton { font-family:'Anton',Impact,sans-serif; line-height:.98; text-shadow:5px 5px 0 rgba(0,0,0,.1); }
  .tag { background:#fff; border-radius:24px; padding:12px 38px; font-weight:700; box-shadow:0 10px 24px rgba(0,0,0,.08); transform:rotate(-1.5deg); align-self:flex-start; }
  .card { background:#fff; border-radius:24px; padding:30px 36px; box-shadow:0 10px 24px rgba(0,0,0,.07); display:flex; flex-direction:column; gap:16px; font-size:40px; font-weight:500; line-height:1.25; }
  .pt { display:flex; gap:16px; } .pt span:first-child { color:var(--accent); font-weight:700; }
  .foot { position:absolute; right:60px; bottom:60px; display:flex; align-items:center; gap:18px; font-size:48px; font-weight:700; }
  .foot i { display:block; width:120px; height:12px; border-radius:6px; background:var(--accent); }
</style>
</head>
<body>

<!-- COVER -->
<section class="slide">
  <div class="handle">@decodedebangi</div>
  <div class="count">1/8</div>
  <div class="body" style="top:260px; gap:20px">
    <div class="pill">topic label</div>
    <div class="anton" style="font-size:124px; color:var(--accent)">WHY YOUR AI AGENT</div>
    <div class="tag" style="font-size:72px">forgets things</div>
    <div class="anton" style="font-size:124px; color:var(--accent)">IN LONG SESSIONS</div>
    <div style="font-size:46px; font-weight:600">and how to fix it ↓</div>
  </div>
  <div class="foot">swipe <i></i></div>
</section>

<!-- CONTENT: numbered layer -->
<section class="slide">
  <div class="handle">@decodedebangi</div>
  <div class="count">2/8</div>
  <div class="body">
    <div class="pill">section label</div>
    <div style="display:flex; align-items:flex-end; gap:28px">
      <div class="anton" style="font-size:200px; line-height:.85; color:var(--accent)">01</div>
      <div class="anton" style="font-size:80px; text-shadow:none">SLIDE<br>HEADLINE</div>
    </div>
    <div class="card">
      <div class="pt"><span>→</span><span>first point with a <b>bold key phrase</b></span></div>
      <div class="pt"><span>→</span><span>second point, one line if possible</span></div>
    </div>
    <div style="border-top:4px solid var(--ink); padding-top:26px">
      <div style="font-family:'JetBrains Mono',monospace; font-size:30px; color:var(--muted)">// what the number means</div>
      <div class="anton" style="font-size:170px; text-shadow:none"><span style="color:#A49A90">2.08</span> <span style="color:var(--accent)">→ 1.32</span></div>
    </div>
  </div>
  <div class="foot">swipe <i></i></div>
</section>

</body>
</html>
