<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bold pastel template</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1A1530; --lav:#CDB8FF; --mint:#B8F2D6; --peach:#FFC9A8; --butter:#FFE98A; --sky:#B9DCFF; }
  body { margin:0; background:#eee; display:flex; flex-direction:column; align-items:center; gap:40px; padding:40px 0; }
  .slide { width:1080px; height:1350px; position:relative; overflow:hidden; font-family:'Bricolage Grotesque',system-ui,sans-serif; color:var(--ink); }
  .top { position:absolute; left:72px; right:72px; top:60px; display:flex; justify-content:space-between; align-items:center; font-size:34px; font-weight:700; }
  .dots { display:flex; gap:10px; align-items:center; }
  .dots i { width:14px; height:14px; border-radius:7px; background:rgba(26,21,48,.25); }
  .dots i.on { width:40px; background:var(--ink); }
  .h1 { font-weight:800; letter-spacing:-4px; line-height:.92; }
  .mark { background:#fff; border-radius:24px; padding:0 18px; }
  .pill { background:var(--ink); color:#fff; border-radius:999px; padding:14px 30px; font-size:32px; font-weight:700; }
  .card { border-radius:48px; padding:44px; }
  .label { display:inline-block; border-radius:999px; padding:8px 22px; font-size:28px; font-weight:700; margin-bottom:18px; }
  .swipe { position:absolute; right:72px; bottom:64px; }
</style>
</head>
<body>

<!-- COVER (lavender) -->
<section class="slide" style="background:var(--lav)">
  <svg aria-hidden="true" width="420" height="420" viewBox="0 0 200 200" style="position:absolute; right:-110px; top:120px">
    <path d="M100 8 L122 70 L190 76 L136 118 L156 186 L100 146 L44 186 L64 118 L10 76 L78 70 Z" fill="#FFE98A"/>
  </svg>
  <div class="top"><span>@decodedebangi</span><span class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span></div>
  <div style="position:absolute; left:72px; right:72px; top:300px; display:flex; flex-direction:column; gap:36px">
    <div class="h1" style="font-size:150px">AI won't<br>take your <span class="mark">job.</span><br>This will.</div>
    <div style="font-size:42px; font-weight:500; color:rgba(26,21,48,.72)">the one skill that matters now</div>
    <div style="display:flex; gap:16px"><span class="pill">myth vs fact</span><span class="pill">6 slides</span></div>
  </div>
  <span class="pill swipe">swipe →</span>
</section>

<!-- CONTENT (mint): myth vs fact -->
<section class="slide" style="background:var(--mint)">
  <div class="top"><span>@decodedebangi</span><span class="dots"><i></i><i class="on"></i><i></i><i></i><i></i><i></i></span></div>
  <div style="position:absolute; left:72px; right:72px; top:190px; display:flex; flex-direction:column; gap:36px">
    <div class="h1" style="font-size:124px">Myth #1</div>
    <div class="card" style="background:#fff">
      <span class="label" style="background:var(--ink); color:#fff">MYTH</span>
      <div style="font-size:44px; font-weight:700; line-height:1.2">the common belief, in one line</div>
    </div>
    <div class="card" style="background:var(--ink); color:#fff">
      <span class="label" style="background:var(--butter); color:var(--ink)">FACT</span>
      <div style="font-size:44px; font-weight:700; line-height:1.2">what's actually true, with a source</div>
    </div>
  </div>
  <span class="pill swipe">swipe →</span>
</section>

</body>
</html>
